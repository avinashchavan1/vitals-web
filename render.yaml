# Render Blueprint — deploys the parse server as a free always-on web service.
# In Render: New → Blueprint → connect the vitals-web repo → it reads this file.
services:
  - type: web
    name: vitals-parse
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: CORS_ORIGIN
        value: "https://vitals-health-telemetry.netlify.app"   # only your site may call the server
